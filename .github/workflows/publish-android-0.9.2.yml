name: Publish Mayleen Android 0.9.2
on:
  push:
    branches: [main]
    paths: [releases/v0.9.2.json]
permissions:
  contents: write
concurrency: mayleen-android-v0.9.2
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and publish the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset=Baby_Feeding_Tracker_ARM64_v0.9.2.apk
          tag=v0.9.2
          expected=3ef2766e9dbe0ee3dfc97c98a8c84b7a30bc32c641c6cda94765ad8700681294
          repo_api="repos/$GITHUB_REPOSITORY"
          gh api "$repo_api/contents/releases/$tag.json?ref=$GITHUB_SHA" --jq .content | base64 --decode > release.json
          jq -er '.blobs | if type == "array" and length > 0 and length <= 32 and all(.[]; type == "string" and test("^[0-9a-f]{40}$")) then .[] else error("Invalid release manifest") end' release.json > blobs.txt
          while IFS= read -r sha; do
            gh api "$repo_api/git/blobs/$sha" --jq .content | base64 --decode
          done < blobs.txt | gzip --decompress > "$asset"
          printf '%s  %s\n' "$expected" "$asset" | sha256sum --check --strict
          gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Mayleen 0.9.2' --notes 'إضافة أيقونة «عن المطوّر» لعرض الإهداء وبيانات التواصل.' --latest
